[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chrono-architect"
version = "0.1.0"
description = "Autonomous AWS FinOps investigation with human-gated safe action"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "mcp>=1.6,<2",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "boto3>=1.43.103",
  "openai>=3.19.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[project.scripts]
chrono = "chrono_architect.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chrono_architect"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
